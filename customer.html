<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Change Part — Morrison</title>
<meta name="description" content="Plain-language review page for a Morrison change part: what we are making, how it looks, what we checked, and what we still need from you." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bea'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffffff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='7' r='2.6' fill='%232f5bea'/%3E%3Ccircle cx='16' cy='25' r='2.6' fill='%232f5bea'/%3E%3Ccircle cx='7' cy='16' r='2.6' fill='%232f5bea'/%3E%3Ccircle cx='25' cy='16' r='2.6' fill='%232f5bea'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f5f7fb;--card:#ffffff;--ink:#16203a;--ink2:#5a6785;--ink3:#8a95ad;
    --line:#e3e8f2;--brand:#2f5bea;--brand-soft:#eaf0ff;
    --ok:#0f9d6b;--ok-soft:#e6f7f0;--warn:#b8690a;--warn-soft:#fdf3e4;--bad:#d5384f;--bad-soft:#fdecef;
    --r:14px;--shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.06);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px 72px}
  header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:28px}
  .top-in{max-width:1040px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#00b894);display:flex;align-items:center;justify-content:center;font-size:17px}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.2px}
  .brand span{color:var(--ink3);font-weight:500}
  .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{border-color:#c9d3e8;background:#fbfcff}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:#2049cd;border-color:#2049cd}
  .btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn-ok:hover{background:#0c845a;border-color:#0c845a}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin-bottom:8px}
  .lede{font-size:17px;color:var(--ink2);max-width:62ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink3);font-weight:700;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:start}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .status{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:100px;font-weight:700;font-size:15px}
  .s-ok{background:var(--ok-soft);color:var(--ok)}
  .s-warn{background:var(--warn-soft);color:var(--warn)}
  .s-bad{background:var(--bad-soft);color:var(--bad)}
  .dims{width:100%;border-collapse:collapse}
  .dims td{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
  .dims tr:last-child td{border-bottom:none}
  .dims td:first-child{color:var(--ink2)}
  .dims td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .viewer{position:relative;background:#f0f3fa;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1/1}
  .viewer canvas{display:block;width:100%;height:100%}
  .viewer .svgwrap{position:absolute;inset:0;display:none;background:#fff;padding:8px}
  .viewer .svgwrap svg{width:100%;height:100%}
  .vtabs{display:flex;gap:6px;margin-bottom:10px}
  .vtab{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2);font-family:inherit}
  .vtab.on{background:var(--brand-soft);border-color:#bed0ff;color:var(--brand)}
  .hint{font-size:13px;color:var(--ink3);margin-top:9px;text-align:center}
  .checks{list-style:none;display:grid;gap:10px}
  .checks li{display:flex;gap:11px;align-items:flex-start;font-size:15px}
  .tick{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px}
  .t-ok{background:var(--ok-soft);color:var(--ok)}
  .t-bad{background:var(--bad-soft);color:var(--bad)}
  .issue{background:var(--bad-soft);border:1px solid #f6ccd4;border-radius:11px;padding:14px 16px;font-size:14.5px;margin-bottom:10px;color:#8c1f31}
  .qbox{background:var(--warn-soft);border:1px solid #f3dcb5;border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .qbox .q{font-weight:700;font-size:15px;margin-bottom:9px;color:#7a4606}
  .qbox textarea{width:100%;border:1px solid #e6cfa4;border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14.5px;resize:vertical;background:#fff;color:var(--ink)}
  .qbox textarea:focus{outline:2px solid #e0a83f;outline-offset:-1px}
  .steps{list-style:none;counter-reset:s;display:grid;gap:0}
  .steps li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .steps li:last-child{border-bottom:none}
  .sdot{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#eef1f7;color:var(--ink3)}
  .sdot.done{background:var(--ok-soft);color:var(--ok)}
  .sdot.now{background:var(--brand-soft);color:var(--brand)}
  .stitle{font-weight:600;font-size:15px}
  .ssub{font-size:13.5px;color:var(--ink3)}
  textarea.req{width:100%;min-height:96px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-family:inherit;font-size:15px;resize:vertical;color:var(--ink)}
  textarea.req:focus{outline:2px solid var(--brand);outline-offset:-1px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .muted{color:var(--ink3);font-size:13.5px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:11px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(22,32,58,.25);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:60}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;padding:70px 20px}
  .empty .big{font-size:46px;margin-bottom:14px}
  .callout{background:var(--brand-soft);border:1px solid #cfdcff;border-radius:11px;padding:15px 17px;font-size:14.5px;color:#22407f}
  .glossary summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--brand);list-style:none}
  .glossary summary::-webkit-details-marker{display:none}
  .glossary summary::before{content:"▸ ";transition:.2s}
  .glossary[open] summary::before{content:"▾ "}
  .glossary dl{margin-top:12px;display:grid;gap:9px;font-size:14.5px}
  .glossary dt{font-weight:700}
  .glossary dd{color:var(--ink2);margin-bottom:5px}
  @media print{
    body{background:#fff}
    .noprint{display:none!important}
    .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
    header.top{margin-bottom:16px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo">⚙</div>
    <div class="brand">Morrison <span>· Change Parts</span></div>
    <div class="spacer"></div>
    <button class="btn noprint" onclick="window.print()">🖨 Save as PDF</button>
    <button class="btn noprint" id="dl-svg" onclick="downloadDrawing()">⬇ Drawing</button>
    <button class="btn noprint" onclick="location.reload()">↻ Refresh</button>
  </div>
</header>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   Customer review page.
   Reads the hand-off the engineering dashboard writes to localStorage,
   presents it in plain language, and writes the customer's decision back.
   No cost, tolerances, weighted scores or internal rankings are ever shown.
   ============================================================ */
const KEY_PAYLOAD='morrison_customer_payload', KEY_REQUEST='morrison_customer_request', KEY_DECISION='morrison_customer_decision';
let P=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

/* Engineering check names -> what they mean for the customer's line. */
const CHECK_WORDS={
  'Geometry Valid (web > 0)':'The shape is physically buildable',
  'Geometry Valid (root < OD, pocket > 0)':'The shape is physically buildable',
  'Geometry Valid (gap > 0)':'The shape is physically buildable',
  'Web Thickness ≥ 8.0 mm':'Enough material between pockets so the part will not flex or crack',
  'Effective Clearance > 0.20 mm':'Your containers fit the pockets without binding, even at their widest tolerance',
  'Effective Pocket Clearance > 0.20 mm':'Your containers fit between the flights without binding',
  'Pocket Clearance ≤ 6.0 mm (timing)':'Containers are held snugly enough to stay in time',
  'Flight Engagement ≥ 20% of bottle ⌀':'The screw grips enough of each container to control it',
  'Flight Thickness ≥ 6.0 mm':'The screw flight is thick enough to last in service',
  'Bottles Engaged ≥ 3':'Enough containers are controlled at once for steady timing',
  'Screw RPM Within Drive Limit':'The screw turns within your machine drive’s speed limit',
  'Drive Torque Within Rating':'Your machine drive has enough torque to turn it',
  'Effective Running Gap > 0.20 mm':'Containers pass the rail without binding',
  'Running Gap ≤ 5.0 mm':'Containers stay seated and cannot tip out',
  'Arc Angle 20–180°':'The rail wrap still allows access for changeovers',
  'Contact Height on Bottle Body (25–75% H)':'The rail touches the straight body of the container, not the shoulder or base',
  'Rail Thickness ≥ 6.0 mm':'The rail is thick enough to stay rigid',
  'Rail Height ≥ 15 mm':'The rail is tall enough to guide the container',
  'Radial Load ≤ Material Allowable':'The chosen material can take the load at your line speed',
  'Speed Within Machine Limit':'Runs at your target line speed',
  'Food-Contact Compliant':'Material is approved for food and beverage contact'
};
function checkWords(name){return CHECK_WORDS[name]||name;}

/* Technical failure text -> customer-facing sentence. */
function issueWords(t){
  t=String(t);
  if(/eff\.?\s*clearance|effective clearance/i.test(t)&&/floor|≤|<=/.test(t))return'The containers would be gripped too tightly and could jam on the line.';
  if(/eff\.?\s*gap|running gap/i.test(t)&&/floor|≤|<=/.test(t))return'The rail would sit too close and could pinch the containers.';
  if(/Gap .* >/.test(t))return'The rail would sit too far away and containers could tip out of the pocket.';
  if(/rattles|mis-times/i.test(t))return'Containers would sit too loosely and lose their spacing.';
  if(/drive limit|rpm/i.test(t))return'The part would have to turn faster than your machine drive allows at this line speed.';
  if(/torque/i.test(t))return'Your machine drive would not have enough torque to turn this part.';
  if(/rated max/i.test(t))return'The requested line speed is above this machine’s rated maximum.';
  if(/not food-contact approved|unregistered/i.test(t))return'The requested material is not approved for food and beverage contact.';
  if(/web .* <|below structural/i.test(t))return'There would be too little material between pockets, risking cracking.';
  if(/traps bottles|changeover access|outside 20/i.test(t))return'The rail would wrap too far around and block access for changeovers.';
  if(/shoulder or base|body band/i.test(t))return'The rail would touch the container’s shoulder or base instead of its straight body.';
  if(/ride over the flight|engages only/i.test(t))return'The screw would not grip enough of each container to control it.';
  if(/bottles engaged|stable timing/i.test(t))return'The screw is too short to control enough containers for steady timing.';
  return t;
}

const FIELD_WORDS={
  material_id:'Material', machine_id:'Your machine', target_speed_cpm:'Line speed',
  bottle_diameter_mm:'Container diameter', bottle_height_mm:'Container height',
  handedness:'Rotation', starts:'Number of flights'
};
const UNITS={target_speed_cpm:'containers/min', bottle_diameter_mm:'mm', bottle_height_mm:'mm'};
function handWords(v){return String(v).toUpperCase().startsWith('L')?'Left-hand':'Right-hand';}

function fmt(k,v){
  if(v==null||v==='')return '—';
  if(k==='handedness')return handWords(v);
  if(typeof v==='number')return (Math.round(v*100)/100)+(UNITS[k]?' '+UNITS[k]:'');
  return String(v)+(UNITS[k]?' '+UNITS[k]:'');
}

/* ---------- 3D preview (same construction as the engineering viewer) ---------- */
let scene,camera,renderer,controls,grp,glOK=false;
function gridGeom(fn,nu,nv){
  const pos=[],idx=[];
  for(let i=0;i<=nu;i++){const u=i/nu;for(let j=0;j<=nv;j++){const p=fn(u,j/nv);pos.push(p[0],p[1],p[2]);}}
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+nv+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
function build3D(){
  const d=P.design,t=P.part_type,body=new THREE.MeshStandardMaterial({color:0x4f77e8,metalness:.1,roughness:.55}),
        hole=new THREE.MeshStandardMaterial({color:0xdfe6f5,side:THREE.BackSide}),
        ghost=new THREE.MeshStandardMaterial({color:0x9fb0cc,transparent:true,opacity:.25,depthWrite:false});
  const g=new THREE.Group(); let extent=300;
  if(t==='feed_screw'){
    const od=d.outer_diameter_mm,root=Math.min(d.root_diameter_mm,od-2),len=d.length_mm,pitch=d.pitch_mm,ft=d.flight_thickness_mm;
    const starts=Math.max(1,Math.round(d.starts||1)),hand=String(d.handedness||'RH').toUpperCase().startsWith('L')?-1:1;
    const core=new THREE.Mesh(new THREE.CylinderGeometry(root/2,root/2,len,48,1),body);core.rotation.z=Math.PI/2;g.add(core);
    const lead=pitch*starts,turns=len/lead,nu=Math.max(24,Math.round(turns*40)),x=u=>-len/2+len*u,r0=root/2-1,r1=od/2;
    const fm=new THREE.MeshStandardMaterial({color:0x2fa08f,metalness:.1,roughness:.5,side:THREE.DoubleSide});
    for(let s=0;s<starts;s++){
      const off=2*Math.PI*s/starts,th=u=>hand*2*Math.PI*turns*u+off;
      const surf=dx=>gridGeom((u,v)=>{const r=r0+(r1-r0)*v,a=th(u);return[x(u)+dx,r*Math.cos(a),r*Math.sin(a)];},nu,2);
      g.add(new THREE.Mesh(surf(ft/2),fm));g.add(new THREE.Mesh(surf(-ft/2),fm));
      g.add(new THREE.Mesh(gridGeom((u,w)=>{const a=th(u);return[x(u)-ft/2+ft*w,r1*Math.cos(a),r1*Math.sin(a)];},nu,1),fm));
    }
    const bd=d.bottle_diameter_mm||66,n=Math.floor(len/pitch);
    for(let k=0;k<Math.min(n,5);k++){const bx=-len/2+pitch*(k+.5)+pitch*.25;if(bx+bd/2>len/2)break;
      const b=new THREE.Mesh(new THREE.CylinderGeometry(bd/2,bd/2,(d.bottle_height_mm||210)*.8,28),ghost);b.position.set(bx,0,root/2+bd/2+.5);g.add(b);}
    extent=len/2+od/2;
  }else if(t==='guide_rail'){
    const R=d.rail_radius_mm,th=d.thickness_mm,h=d.rail_height_mm,arc=d.arc_angle_deg*Math.PI/180,pcd=d.mating_pcd_mm||620,bd=d.bottle_diameter_mm||54;
    const a0=-Math.PI/2-arc/2,a1=-Math.PI/2+arc/2,sh=new THREE.Shape();
    sh.absarc(0,0,R,a0,a1,false);sh.absarc(0,0,R+th,a1,a0,true);
    const rail=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false,curveSegments:64}),body);
    rail.rotation.x=-Math.PI/2;rail.position.y=-h/2;g.add(rail);
    const wheelR=pcd/2+bd/2+9;
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(wheelR,wheelR,16,80,1),new THREE.MeshStandardMaterial({color:0xb9c6de,transparent:true,opacity:.3,depthWrite:false}));
    wheel.position.y=-h/2-9;g.add(wheel);
    const N=Math.max(1,Math.round(Math.PI*pcd/(2.2*bd))),nArc=Math.max(1,Math.round(arc/(2*Math.PI)*N));
    for(let i=0;i<nArc;i++){const a=Math.PI/2+(i-(nArc-1)/2)*(2*Math.PI/N);
      const b=new THREE.Mesh(new THREE.CylinderGeometry(bd/2,bd/2,(d.bottle_height_mm||210)*.6,28),ghost);
      b.position.set((pcd/2)*Math.cos(a),(d.bottle_height_mm||210)*.3-h/2,(pcd/2)*Math.sin(a));g.add(b);}
    extent=R+th;
  }else{
    const pcd=d.pcd_mm,n=Math.max(1,Math.round(d.pocket_count)),r=d.pocket_radius_mm,th=d.wheel_thickness_mm,
          rim=d.rim_mm||8,bore=d.bore_diameter_mm||50,OD=pcd+2*r+2*rim;
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(OD/2,OD/2,th,96,1),body));
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(bore/2+.5,bore/2+.5,th+2,32),hole));
    const pg=new THREE.CylinderGeometry(r,r,th+4,28);
    for(let i=0;i<n;i++){const a=2*Math.PI*i/n;const m=new THREE.Mesh(pg,hole);m.position.set((pcd/2)*Math.cos(a),0,(pcd/2)*Math.sin(a));g.add(m);}
    extent=OD/2;
  }
  return{g,extent};
}
function init3D(){
  const host=document.getElementById('v3d'); if(!host||typeof THREE==='undefined')return;
  try{
    const cv=document.getElementById('cv3d'),w=host.clientWidth||400,h=host.clientHeight||400;
    scene=new THREE.Scene();scene.background=new THREE.Color(0xf0f3fa);
    camera=new THREE.PerspectiveCamera(45,w/h,1,8000);
    renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});renderer.setSize(w,h);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    if(typeof THREE.OrbitControls!=='function')throw new Error('controls unavailable');
    controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;
    scene.add(new THREE.AmbientLight(0xffffff,.75));
    const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(300,600,400);scene.add(dl);
    const dl2=new THREE.DirectionalLight(0xc9d8ff,.5);dl2.position.set(-400,-150,-300);scene.add(dl2);
    const{g,extent}=build3D();grp=g;scene.add(g);
    const dist=(extent*1.2)/(Math.tan(camera.fov*Math.PI/360)*Math.min(1,camera.aspect||1));
    camera.position.set(0,.8*dist,.6*dist);controls.target.set(0,0,0);camera.lookAt(0,0,0);controls.update();
    glOK=true;
    (function loop(){requestAnimationFrame(loop);if(grp)grp.rotation.y+=.0022;controls.update();renderer.render(scene,camera);})();
    window.addEventListener('resize',()=>{const W=host.clientWidth,H=host.clientHeight;if(!W||!H)return;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});
  }catch(e){
    console.warn('3D preview unavailable:',e.message);
    host.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8a95ad;font-size:14px;padding:20px;text-align:center">3D preview needs an internet connection.<br/>The dimensioned drawing tab still works.</div>';
    showView('2d');
  }
}
function showView(which){
  const c=document.getElementById('cv3d'),s=document.getElementById('svgwrap');
  if(c)c.style.display=which==='3d'?'block':'none';
  if(s)s.style.display=which==='2d'?'block':'none';
  const t3=document.getElementById('tab3d'),t2=document.getElementById('tab2d');
  if(t3)t3.classList.toggle('on',which==='3d');
  if(t2)t2.classList.toggle('on',which==='2d');
}
function downloadDrawing(){
  if(!P||!P.svg){toast('No drawing available');return;}
  const blob=new Blob([P.svg],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(P.part_type||'part')+'-drawing.svg';
  document.body.appendChild(a);a.click();a.remove();
}

/* ---------- actions back to engineering ---------- */
function sendRequest(){
  const ta=document.getElementById('reqtext'),txt=ta.value.trim();
  if(!txt){ta.focus();toast('Tell us what to change first');return;}
  const answers=[...document.querySelectorAll('.qans')].map(el=>({q:el.dataset.q,a:el.value.trim()})).filter(x=>x.a);
  const full=txt+(answers.length?'\n\nAnswers to your questions:\n'+answers.map(x=>'- '+x.q+' → '+x.a).join('\n'):'');
  localStorage.setItem(KEY_REQUEST,JSON.stringify({ts:Date.now(),text:full,part_type:P.part_type}));
  localStorage.removeItem(KEY_DECISION);
  ta.value='';
  toast('Sent to engineering ✓');
  render();
}
function approve(){
  const answers=[...document.querySelectorAll('.qans')].map(el=>({q:el.dataset.q,a:el.value.trim()})).filter(x=>x.a);
  const note=answers.length?'Approved with answers:\n'+answers.map(x=>'- '+x.q+' → '+x.a).join('\n'):'Approved as presented.';
  localStorage.setItem(KEY_DECISION,JSON.stringify({ts:Date.now(),decision:'approved',note,part_type:P.part_type}));
  localStorage.removeItem(KEY_REQUEST);
  toast('Approved — thank you ✓');
  render();
}

/* ---------- page ---------- */
function render(){
  const app=document.getElementById('app');
  try{P=JSON.parse(localStorage.getItem(KEY_PAYLOAD)||'null');}catch(e){P=null;}
  if(!P){
    app.innerHTML=`<div class="card empty"><div class="big">📐</div>
      <h1>Nothing to review yet</h1>
      <p class="lede" style="margin:10px auto 0">Your Morrison engineer will send a design here.
      When they do, this page will show what is being made for you, how it looks in 3D, and anything we still need from you.</p>
      <div class="row" style="justify-content:center"><button class="btn btn-primary noprint" onclick="location.reload()">↻ Check again</button></div></div>`;
    return;
  }
  const accepted=P.verdict==='accept';
  const dec=(()=>{try{return JSON.parse(localStorage.getItem(KEY_DECISION)||'null');}catch(e){return null;}})();
  const req=(()=>{try{return JSON.parse(localStorage.getItem(KEY_REQUEST)||'null');}catch(e){return null;}})();
  const d=P.design||{};
  const dims=(P.dims&&P.dims.length?P.dims:Object.keys(d).map(k=>({k,l:FIELD_WORDS[k]||k,u:''})))
    .filter(x=>d[x.k]!=null)
    .map(x=>`<tr><td>${esc(x.l)}</td><td>${esc(fmt(x.k,d[x.k]))}${x.u&&typeof d[x.k]==='number'?' '+esc(x.u):''}</td></tr>`).join('');
  const context=['material_id','machine_id','target_speed_cpm','bottle_diameter_mm','bottle_height_mm']
    .filter(k=>d[k]!=null).map(k=>`<tr><td>${esc(FIELD_WORDS[k]||k)}</td><td>${esc(fmt(k,d[k]))}</td></tr>`).join('');

  const statusChip=dec?`<div class="status s-ok">✓ You approved this design</div>`
    :req?`<div class="status s-warn">✎ Your change request is with engineering</div>`
    :accepted?`<div class="status s-ok">✓ Ready for your review</div>`
    :`<div class="status s-warn">⏳ Our engineers are still working on this</div>`;

  const issues=(!accepted&&P.issues&&P.issues.length)
    ? `<div class="card"><h2>What we are still resolving</h2>
        ${P.issues.map(i=>`<div class="issue">${esc(issueWords(i))}</div>`).join('')}
        <p class="muted">Our automatic safety checks flagged these, so this design is not being offered to you yet — the team is adjusting it now.</p></div>`
    : '';

  const questions=(P.open_questions&&P.open_questions.length)
    ? `<div class="card"><h2>We need a little more from you</h2>
        ${P.open_questions.map((q,i)=>`<div class="qbox"><div class="q">${esc(q)}</div>
          <textarea class="qans" data-q="${esc(q)}" rows="2" placeholder="Your answer…"></textarea></div>`).join('')}
        <p class="muted">Answer what you can — anything you leave blank we will confirm with you by phone.</p></div>`
    : '';

  const checks=(P.checks||[]).map(c=>`<li><span class="tick ${c.pass?'t-ok':'t-bad'}">${c.pass?'✓':'!'}</span><span>${esc(checkWords(c.name))}</span></li>`).join('');

  const stepNames={'1':'Reading your request','2':'Comparing with past parts','3':'Designing options','4':'Preparing the CAD model','5':'Safety & standards checks','6':'Your review','7':'Applying your changes'};
  const steps=(P.stages||[]).map(s=>{
    const done=s.status==='done'||s.status==='none';
    const now=s.status==='run';
    return `<li><span class="sdot ${done?'done':(now?'now':'')}">${done?'✓':(now?'●':'')}</span>
      <div><div class="stitle">${esc(stepNames[s.id]||s.name)}</div>
      <div class="ssub">${done?'Complete':(now?'In progress':'Not started')}</div></div></li>`;
  }).join('');

  app.innerHTML=`
  <h1>Your ${esc(P.label||'change part')}</h1>
  <p class="lede">${esc(P.summary||'')}</p>
  <div class="row" style="margin-bottom:22px">${statusChip}</div>

  ${dec?`<div class="card" style="border-color:#bfe5d5;background:#f4fbf8"><strong>Approved on ${esc(new Date(dec.ts).toLocaleString())}.</strong> Our team will confirm lead time and pricing separately. You can still send a change below if you need one.</div>`:''}
  ${req?`<div class="card" style="border-color:#f3dcb5;background:#fffaf1"><strong>Change request sent ${esc(new Date(req.ts).toLocaleString())}:</strong><br/>“${esc(req.text)}”<br/><span class="muted">An engineer is applying this now — refresh this page after they update the design.</span></div>`:''}

  <div class="grid2">
    <div class="card">
      <h2>How it looks</h2>
      <div class="vtabs noprint">
        <button class="vtab on" id="tab3d" onclick="showView('3d')">3D model</button>
        <button class="vtab" id="tab2d" onclick="showView('2d')">Dimensioned drawing</button>
      </div>
      <div class="viewer" id="v3d">
        <canvas id="cv3d"></canvas>
        <div class="svgwrap" id="svgwrap">${P.svg||''}</div>
      </div>
      <p class="hint">Drag to rotate · scroll to zoom. The pale shapes are your containers, shown for scale.</p>
    </div>

    <div>
      <div class="card">
        <h2>Main dimensions</h2>
        <table class="dims">${dims||'<tr><td>—</td><td>—</td></tr>'}</table>
      </div>
      <div class="card">
        <h2>Made for your line</h2>
        <table class="dims">${context}</table>
      </div>
    </div>
  </div>

  ${issues}
  ${questions}

  <div class="card">
    <h2>What we checked for you</h2>
    <ul class="checks">${checks}</ul>
    <p class="muted" style="margin-top:14px">These are automatic engineering checks against machine ratings, container tolerances and food-contact standards — run on every design before it reaches you.</p>
  </div>

  <div class="card noprint">
    <h2>Your decision</h2>
    <div class="callout" style="margin-bottom:16px">Happy with it? Approve and we will proceed. Need something different? Just describe it in your own words — no drawings or technical terms needed.</div>
    <textarea class="req" id="reqtext" placeholder="For example: “Can the pockets be a bit looser, our bottles vary a little” or “We would prefer a different material”"></textarea>
    <div class="row">
      <button class="btn btn-ok" onclick="approve()">✓ Approve this design</button>
      <button class="btn btn-primary" onclick="sendRequest()">✎ Request a change</button>
      <span class="muted">Your engineer sees this straight away.</span>
    </div>
  </div>

  <div class="card">
    <h2>Where we are</h2>
    <ul class="steps">${steps||'<li class="muted">Not started yet</li>'}</ul>
  </div>

  <div class="card">
    <details class="glossary"><summary>What do these words mean?</summary>
      <dl>
        <dt>Change part</dt><dd>The parts on your machine that get swapped when you change container size or shape.</dd>
        <dt>Starwheel</dt><dd>A rotating wheel with pockets that carries each container through the machine.</dd>
        <dt>Feed screw (timing screw)</dt><dd>A spiral screw at the infeed that spaces containers evenly and feeds them in one at a time.</dd>
        <dt>Guide rail</dt><dd>A curved rail that keeps containers seated in the starwheel pockets as they go round.</dd>
        <dt>Pitch circle diameter (PCD)</dt><dd>The diameter of the circle the pocket centres sit on.</dd>
        <dt>Clearance</dt><dd>The small gap between your container and the part — too tight and it jams, too loose and it rattles.</dd>
        <dt>Containers per minute</dt><dd>Your line speed: how many containers pass through in a minute.</dd>
      </dl>
    </details>
  </div>

  <p class="muted" style="text-align:center;margin-top:26px">Prepared ${esc(new Date(P.generatedAt||Date.now()).toLocaleString())} · Morrison Container Handling Solutions<br/>
  Dimensions shown for your approval. Manufacturing tolerances, cost and internal engineering data are not included on this page.</p>`;

  setTimeout(()=>{ if(P.svg) init3D(); else showView('2d'); },0);
}

window.addEventListener('storage',e=>{ if(e.key===KEY_PAYLOAD) render(); });
render();
</script>
</body>
</html>
